      summary: Outlet profile
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
      responses:
        '200':
          description: Restaurant
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '404': { $ref: '#/components/responses/Problem404' }
    patch:
      operationId: updateMyRestaurant
      tags: [Partner Restaurant]
      summary: Update outlet profile (owner)
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/IfMatchRequired' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { type: [string, 'null'], maxLength: 500 }
                minOrderPaise: { type: integer, minimum: 0 }
                avgPrepTimeMin: { type: integer, minimum: 5, maximum: 90 }
                packagingMode: { type: string, enum: [PER_ITEM, PER_ORDER, NONE] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDetail' }
        '412': { $ref: '#/components/responses/Problem412' }
  /partner/restaurants/{restaurantId}/operating-hours:
    put:
      operationId: setOperatingHours
      tags: [Partner Restaurant]
      summary: Replace the weekly operating hours (owner)
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/IfMatchRequired' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [week]
              properties:
                week:
                  type: array
                  items:
                    type: object
                    properties:
                      dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
                      slots:
                        type: array
                        items:
                          type: object
                          properties:
                            opensAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
                            closesAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
      responses:
        '200': { description: Replaced }
        '422': { $ref: '#/components/responses/Problem422' }
  /partner/restaurants/{restaurantId}/open:
    post:
      operationId: openRestaurant
      tags: [Partner Restaurant]
      summary: Start taking orders
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      responses:
        '200': { description: Open }
        '422': { $ref: '#/components/responses/Problem422' }
  /partner/restaurants/{restaurantId}/close:
    post:
      operationId: closeRestaurant
      tags: [Partner Restaurant]
      summary: Stop for the day
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      responses:
        '200': { description: Closed }
  /partner/restaurants/{restaurantId}/pause:
    post:
      operationId: pauseRestaurant
      tags: [Partner Restaurant]
      summary: Pause for a while (busy)
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                durationMinutes: { type: [integer, 'null'], enum: [15, 30, 60, null] }
                reasonCode: { type: string }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { type: object, properties: { pausedUntil: { type: [string, 'null'], format: date-time } } }
  /partner/restaurants/{restaurantId}/resume:
    post:
      operationId: resumeRestaurant
      tags: [Partner Restaurant]
      summary: Resume taking orders (also clears auto-pauses)
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      responses:
        '200': { description: Resumed }
  /partner/restaurants/{restaurantId}/devices/heartbeat:
    post:
      operationId: deviceHeartbeat
      tags: [Partner Restaurant]
      summary: Order-receiver device heartbeat
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceInstallId]
              properties:
                deviceInstallId: { type: string }
                isOrderReceiver: { type: boolean }
                pushOk: { type: boolean }
                appVersion: { type: [string, 'null'] }
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime: { $ref: '#/components/schemas/Timestamp' }
                  outletState: { type: string }
  /partner/restaurants/{restaurantId}/menu:
    get:
      operationId: getPartnerMenu
      tags: [Partner Menu]
      summary: Full editable menu
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
  /partner/restaurants/{restaurantId}/menu-items:
    post:
      operationId: createMenuItem
      tags: [Partner Menu]
      summary: Create a menu item
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categoryId, name, vegType, price]
              properties:
                categoryId: { $ref: '#/components/schemas/Uuid' }
                name: { type: string, minLength: 1, maxLength: 80 }
                nameI18n: { $ref: '#/components/schemas/I18nText' }
                description: { type: [string, 'null'], maxLength: 300 }
                vegType: { $ref: '#/components/schemas/VegType' }
                price: { $ref: '#/components/schemas/Money' }
                packaging: { $ref: '#/components/schemas/Money' }
                imageFileId: { oneOf: [ { $ref: '#/components/schemas/Uuid' }, { type: 'null' } ] }
                isRecommended: { type: boolean }
                spiceLevel: { type: [integer, 'null'], minimum: 0, maximum: 3 }
                serves: { type: [integer, 'null'] }
                addonGroupIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '422': { $ref: '#/components/responses/Problem422' }
  /partner/restaurants/{restaurantId}/menu-items/{id}:
    patch:
      operationId: updateMenuItem
      tags: [Partner Menu]
      summary: Update a menu item
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/IfMatchRequired' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
        '412': { $ref: '#/components/responses/Problem412' }
    delete:
      operationId: archiveMenuItem
      tags: [Partner Menu]
      summary: Archive a menu item
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      responses:
        '204': { description: Archived }
  /partner/restaurants/{restaurantId}/menu-items/{id}/availability:
    post:
      operationId: setMenuItemAvailability
      tags: [Partner Menu]
      summary: Toggle in-stock (last write wins)
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
                until: { type: [string, 'null'] }
      responses:
        '200': { description: Toggled }
  /partner/restaurants/{restaurantId}/menu-categories:
    post:
      operationId: createMenuCategory
      tags: [Partner Menu]
      summary: Create a menu category
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                nameI18n: { $ref: '#/components/schemas/I18nText' }
                sortOrder: { type: integer }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Problem409' }
  /partner/restaurants/{restaurantId}/addon-groups:
    post:
      operationId: createAddonGroup
      tags: [Partner Menu]
      summary: Create an add-on group
      parameters:
        - { $ref: '#/components/parameters/RestaurantIdPath' }
        - { $ref: '#/components/parameters/XRovoClient' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, minSelect, maxSelect, addons]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                minSelect: { type: integer, minimum: 0 }
                maxSelect: { type: integer, minimum: 1, maximum: 20 }
                addons:
                  type: array
                  items:
                    type: object
                    required: [name, price, vegType]
                    properties:
                      name: { type: string }
                      price: { $ref: '#/components/schemas/Money' }
                      vegType: { $ref: '#/components/schemas/VegType' }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Problem422' }
