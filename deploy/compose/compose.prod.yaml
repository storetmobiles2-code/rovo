# SPDX-License-Identifier: Apache-2.0
#
# rovo PRODUCTION-LIKE stack (ADR-P2-003: the Phase-2 deployment target is the
# dev/demo path, R24). Same images that would run on ECS; Caddy plays the role
# of CloudFront (four app hosts + api. webhooks host, /api/* same-origin).
#
#   make prod-up [TLS=internal]   build images, start, wait healthy
#   make prod-seed                load demo data
#   make smoke                    scripts/smoke.sh against ROVO_DOMAIN
#   make prod-down
#
# Secrets come from .env (generate with `make dev-keys`); the stack refuses to
# start without them. Fake payment/SMS/push providers are used throughout.

name: rovo

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-backend-image: &backend-image
  image: ${ROVO_IMAGE:-rovo:local}
  build:
    context: ../..
    dockerfile: deploy/docker/backend.Dockerfile
    args:
      VERSION: ${ROVO_VERSION:-dev}
      COMMIT: ${ROVO_COMMIT:-unknown}
      BUILD_TAGS: ${ROVO_BUILD_TAGS:-}

# Shared application configuration (12-factor; see .env.example for meanings).
x-app-env: &app-env
  ROVO_ENV: ${ROVO_STACK_ENV:-staging}
  ROVO_HTTP_ADDR: ":8080"
  ROVO_INTERNAL_ADDR: ":9090"
  ROVO_DATABASE_URL: postgres://rovo:${ROVO_PROD_DB_PASSWORD:-rovo-prodlike}@postgis:5432/rovo?sslmode=disable
  ROVO_APP_HOSTS: app.${ROVO_DOMAIN:-rovo.localhost}=customer,restaurant.${ROVO_DOMAIN:-rovo.localhost}=restaurant,rider.${ROVO_DOMAIN:-rovo.localhost}=rider,admin.${ROVO_DOMAIN:-rovo.localhost}=admin,api.${ROVO_DOMAIN:-rovo.localhost}=webhook
  ROVO_CUSTOMER_BASE_URL: ${ROVO_SITE_SCHEME:-http}://app.${ROVO_DOMAIN:-rovo.localhost}
  ROVO_JWT_SIGNING_KEY: ${ROVO_JWT_SIGNING_KEY:?run make dev-keys}
  ROVO_QUOTE_SIGNING_KEY: ${ROVO_QUOTE_SIGNING_KEY:?run make dev-keys}
  ROVO_FIELD_ENCRYPTION_KEY: ${ROVO_FIELD_ENCRYPTION_KEY:?run make dev-keys}
  ROVO_COOKIE_SECURE: ${ROVO_PROD_COOKIE_SECURE:-false}
  ROVO_TRUSTED_ORIGIN_SECRET: ${ROVO_TRUSTED_ORIGIN_SECRET:?run make dev-keys}
  ROVO_PAYMENT_PROVIDER: ${ROVO_PAYMENT_PROVIDER:-fake}
  ROVO_FAKEPA_WEBHOOK_SECRET: ${ROVO_FAKEPA_WEBHOOK_SECRET:?run make dev-keys}
  ROVO_SMS_PROVIDER: ${ROVO_SMS_PROVIDER:-fake}
  ROVO_PUSH_VAPID_PUBLIC_KEY: ${ROVO_PUSH_VAPID_PUBLIC_KEY:-}
  ROVO_PUSH_VAPID_PRIVATE_KEY: ${ROVO_PUSH_VAPID_PRIVATE_KEY:-}
  ROVO_S3_ENDPOINT: http://minio:9000
  ROVO_S3_REGION: ${ROVO_S3_REGION:-ap-south-1}
  ROVO_S3_ACCESS_KEY: ${ROVO_S3_ACCESS_KEY:-rovo-dev}
  ROVO_S3_SECRET_KEY: ${ROVO_S3_SECRET_KEY:-rovo-dev-secret}
  ROVO_S3_BUCKET_MEDIA: ${ROVO_S3_BUCKET_MEDIA:-media}
  ROVO_S3_BUCKET_KYC: ${ROVO_S3_BUCKET_KYC:-kyc}
  ROVO_S3_PUBLIC_MEDIA_BASE_URL: /media
  ROVO_SMTP_ADDR: mailpit:1025
  ROVO_LOG_LEVEL: ${ROVO_PROD_LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Only honoured by images built with BUILD_TAGS=testhooks (E2E); empty = off.
  ROVO_TESTHOOKS_ADDR: ${ROVO_PROD_TESTHOOKS_ADDR:-}
  ROVO_TESTHOOKS_SECRET: ${ROVO_TESTHOOKS_SECRET:-}
  ROVO_ADMIN_BOOTSTRAP_PASSWORD: ${ROVO_ADMIN_BOOTSTRAP_PASSWORD:-}
  ROVO_DOMAIN: ${ROVO_DOMAIN:-rovo.localhost}

services:
  postgis:
    image: ${ROVO_POSTGRES_IMAGE:-postgis/postgis:17-3.5}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    environment:
      POSTGRES_USER: rovo
      POSTGRES_PASSWORD: ${ROVO_PROD_DB_PASSWORD:-rovo-prodlike}
      POSTGRES_DB: rovo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ${ROVO_BACKUP_DIR:-../../backups}:/backups
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovo -d rovo && psql -U rovo -d rovo -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  migrate:
    <<: [*hardening, *backend-image]
    command: ["migrate", "up"]
    restart: "no"
    user: "65532:65532"
    environment: *app-env
    depends_on:
      postgis:
        condition: service_healthy
    networks: [data]
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  api:
    <<: [*hardening, *backend-image]
    command: ["api"]
    restart: unless-stopped
    user: "65532:65532"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [edge, data]
    expose: ["8080", "9090"]
    ports:
      # Test hooks listener (testhooks images only); loopback on the host.
      - "127.0.0.1:${ROVO_PROD_TESTHOOKS_PORT:-9191}:9191"
    stop_grace_period: 30s
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  worker:
    <<: [*hardening, *backend-image]
    command: ["worker"]
    restart: unless-stopped
    user: "65532:65532"
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, data]
    expose: ["9090"]
    # Let in-flight River jobs finish (doc 22 §5: stopTimeout 120 s).
    stop_grace_period: 120s
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  minio:
    image: ${ROVO_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ROVO_S3_ACCESS_KEY:-rovo-dev}
      MINIO_ROOT_PASSWORD: ${ROVO_S3_SECRET_KEY:-rovo-dev-secret}
      MINIO_REGION: ${ROVO_S3_REGION:-ap-south-1}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    networks: [edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  minio-init:
    image: ${ROVO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ROVO_S3_ACCESS_KEY:-rovo-dev}
      MINIO_ROOT_PASSWORD: ${ROVO_S3_SECRET_KEY:-rovo-dev-secret}
      ROVO_S3_BUCKET_MEDIA: ${ROVO_S3_BUCKET_MEDIA:-media}
      ROVO_S3_BUCKET_KYC: ${ROVO_S3_BUCKET_KYC:-kyc}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks: [edge]

  mailpit:
    image: ${ROVO_MAILPIT_IMAGE:-axllent/mailpit:v1.29}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DISABLE_VERSION_CHECK: "1"
    networks: [data, edge]
    ports:
      - "127.0.0.1:${ROVO_PROD_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: ${ROVO_WEB_IMAGE:-rovo-web:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VERSION: ${ROVO_VERSION:-dev}
        COMMIT: ${ROVO_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ROVO_DOMAIN: ${ROVO_DOMAIN:-rovo.localhost}
      ROVO_SITE_SCHEME: ${ROVO_SITE_SCHEME:-http}
      ROVO_CADDY_TLS: ${ROVO_CADDY_TLS:-off}
      ROVO_ACME_EMAIL: ${ROVO_ACME_EMAIL:-}
      ROVO_TRUSTED_ORIGIN_SECRET: ${ROVO_TRUSTED_ORIGIN_SECRET:?run make dev-keys}
      ROVO_API_UPSTREAM: api:8080
      ROVO_MEDIA_UPSTREAM: minio:9000
    # Mount the repo Caddyfile over the baked one (edit without rebuilding).
    volumes:
      - ../caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${ROVO_PROD_HTTP_PORT:-80}:80"
      - "${ROVO_PROD_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # --- optional observability (profile "observability") -------------------
  prometheus:
    profiles: ["observability"]
    image: ${ROVO_PROMETHEUS_IMAGE:-prom/prometheus:v3.7.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    networks: [data, edge]
    ports:
      - "127.0.0.1:${ROVO_PROD_PROMETHEUS_PORT:-9091}:9090"

  grafana:
    profiles: ["observability"]
    image: ${ROVO_GRAFANA_IMAGE:-grafana/grafana:12.2.0}
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ROVO_GRAFANA_ADMIN_PASSWORD:-rovo-dev}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [data, edge]
    ports:
      - "127.0.0.1:${ROVO_PROD_GRAFANA_PORT:-3000}:3000"

networks:
  # Public-facing services and provider egress.
  edge: {}
  # Database tier: no route to the internet, never published.
  data:
    internal: true

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
