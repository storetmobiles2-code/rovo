# SPDX-License-Identifier: Apache-2.0
#
# rovo LOCAL DEV dependencies (doc 22 §10). The Go binary and the four Vite
# apps run on the host (`make dev`); this file provides their backing services.
#
#   make up        start postgis, minio (+bucket init), mailpit
#   make up-cache  also start valkey (profile "cache"; unused by default, P6)
#   make obs-up    also start prometheus + grafana (profile "observability")
#   make down / make reset
#
# All values are dev-only defaults. Nothing here is a secret.

name: rovo-dev

x-restart: &restart
  restart: unless-stopped

services:
  postgis:
    <<: *restart
    # Official image is amd64-only; `make` switches to imresamu/postgis on arm64
    # hosts (see deploy/docker/POSTGIS.md).
    image: ${ROVO_POSTGRES_IMAGE:-postgis/postgis:17-3.5}
    environment:
      POSTGRES_USER: rovo
      POSTGRES_PASSWORD: rovo
      POSTGRES_DB: rovo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=200
    ports:
      - "${ROVO_DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovo -d rovo && psql -U rovo -d rovo -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    <<: *restart
    # Upstream MinIO stopped publishing images; pgsty/minio is a maintained
    # build of the same AGPL server. Dev/test only: production uses AWS S3.
    image: ${ROVO_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rovo-dev
      MINIO_ROOT_PASSWORD: rovo-dev-secret
      MINIO_REGION: ap-south-1
    ports:
      - "${ROVO_DEV_S3_PORT:-9000}:9000"
      - "${ROVO_DEV_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: ${ROVO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: rovo-dev
      MINIO_ROOT_PASSWORD: rovo-dev-secret
      ROVO_S3_BUCKET_MEDIA: ${ROVO_S3_BUCKET_MEDIA:-media}
      ROVO_S3_BUCKET_KYC: ${ROVO_S3_BUCKET_KYC:-kyc}
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

  mailpit:
    <<: *restart
    image: ${ROVO_MAILPIT_IMAGE:-axllent/mailpit:v1.29}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DISABLE_VERSION_CHECK: "1"
    ports:
      - "${ROVO_DEV_SMTP_PORT:-1025}:1025"
      - "${ROVO_DEV_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  valkey:
    <<: *restart
    profiles: ["cache"]
    image: ${ROVO_VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${ROVO_DEV_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- optional observability (profile "observability") -------------------
  # Scrapes the api/worker running on the host (make run-api / run-worker).
  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: ${ROVO_PROMETHEUS_IMAGE:-prom/prometheus:v3.7.0}
    command:
      - --config.file=/etc/prometheus/prometheus.dev.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${ROVO_DEV_PROMETHEUS_PORT:-9091}:9090"

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: ${ROVO_GRAFANA_IMAGE:-grafana/grafana:12.2.0}
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: rovo-dev
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${ROVO_DEV_GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
