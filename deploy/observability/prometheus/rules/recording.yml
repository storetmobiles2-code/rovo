# Recording rules used by dashboards and SLO burn-rate alerts (doc 24 §7).
# Metric contract: deploy/observability/README.md.
groups:
  - name: rovo-http-recording
    interval: 30s
    rules:
      # Requests/s by status class, excluding health/metrics routes.
      - record: rovo:http_requests:rate5m
        expr: sum by (status_class) (rate(rovo_http_request_duration_seconds_count{route!~"/healthz|/readyz|/metrics"}[5m]))
      - record: rovo:http_errors5xx:ratio_rate5m
        expr: |
          sum(rate(rovo_http_request_duration_seconds_count{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(rovo_http_request_duration_seconds_count[5m])), 1e-9)
      - record: rovo:http_errors5xx:ratio_rate30m
        expr: |
          sum(rate(rovo_http_request_duration_seconds_count{status_class="5xx"}[30m]))
          /
          clamp_min(sum(rate(rovo_http_request_duration_seconds_count[30m])), 1e-9)
      - record: rovo:http_errors5xx:ratio_rate1h
        expr: |
          sum(rate(rovo_http_request_duration_seconds_count{status_class="5xx"}[1h]))
          /
          clamp_min(sum(rate(rovo_http_request_duration_seconds_count[1h])), 1e-9)
      - record: rovo:http_errors5xx:ratio_rate6h
        expr: |
          sum(rate(rovo_http_request_duration_seconds_count{status_class="5xx"}[6h]))
          /
          clamp_min(sum(rate(rovo_http_request_duration_seconds_count[6h])), 1e-9)
      - record: rovo:http_errors5xx:ratio_rate3d
        expr: |
          sum(rate(rovo_http_request_duration_seconds_count{status_class="5xx"}[3d]))
          /
          clamp_min(sum(rate(rovo_http_request_duration_seconds_count[3d])), 1e-9)
      - record: rovo:http_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le, route) (rate(rovo_http_request_duration_seconds_bucket[5m])))

  - name: rovo-business-recording
    interval: 1m
    rules:
      - record: rovo:orders_by_status:increase1h
        expr: sum by (status) (increase(rovo_orders_total[1h]))
      - record: rovo:offer_accept_ratio:30m
        expr: |
          sum(increase(rovo_delivery_offers_total{outcome="accepted"}[30m]))
          /
          clamp_min(sum(increase(rovo_delivery_offers_total[30m])), 1)
      - record: rovo:payment_success_ratio:15m
        expr: |
          sum(increase(rovo_payments_total{result="success"}[15m]))
          /
          clamp_min(sum(increase(rovo_payments_total[15m])), 1)
