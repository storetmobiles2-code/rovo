# Prometheus for the production-like Compose stack (profile "observability").
# Production uses Grafana Cloud (R36); these rules are the same PromQL.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: compose

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rovo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
        labels: { service: rovo-api }
  - job_name: rovo-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
        labels: { service: rovo-worker }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
