# rovo dependency updates (doc 21, doc 26 §10).
# Keeps GitHub Actions, the Go module, the pnpm workspace and the Docker base
# images current. Third-party actions are pinned by commit SHA in the workflows;
# this is what moves those pins (and everything else) forward safely.
version: 2

updates:
  # --- GitHub Actions (SHA-pinned in .github/workflows/*) --------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # --- Go backend module ----------------------------------------------------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    labels: [dependencies, backend]
    groups:
      # Patch/minor bumps land in one PR; majors stay separate for review.
      go-minor:
        update-types: [minor, patch]

  # --- pnpm web workspace ---------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: build
    labels: [dependencies, web]
    groups:
      web-minor:
        update-types: [minor, patch]

  # --- Dockerfiles (base image digests) -------------------------------------
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels: [dependencies, docker]
