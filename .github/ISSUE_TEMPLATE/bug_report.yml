name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, access tokens or
        personal data. For security vulnerabilities, use private reporting
        instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the expected vs actual behaviour.
      placeholder: I placed an order and the status never moved past PENDING...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can see it too.
      value: |
        1. Go to '...'
        2. Do '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app / area?
      options:
        - customer PWA
        - restaurant PWA
        - rider PWA
        - admin PWA
        - backend API / worker
        - deploy / infra / CI
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of the footer version, a release tag, or the git SHA.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you are running rovo and on what.
      value: |
        - Running: local `make dev` / `make prod-up` / hosted
        - OS:
        - Browser (for a PWA):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Relevant log lines or screenshots. Redact anything sensitive.
      render: shell
